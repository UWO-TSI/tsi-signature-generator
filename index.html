<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSI Signature Generator</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f10;
    --surface: #18181b;
    --border: #2a2a2f;
    --text: #f1ffff;
    --muted: #9ca3af;
    --accent: #1d9bf0;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  header { padding: 32px 24px 16px; max-width: 1100px; margin: 0 auto; }
  header h1 { font-family: var(--mono); font-weight: 500; font-size: 18px; margin: 0 0 6px; letter-spacing: 0.02em; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }
  header a { color: var(--accent); text-decoration: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 24px 24px; max-width: 1100px; margin: 0 auto; }
  .controls label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .controls input[type=search], .controls select {
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  .controls input[type=search] { min-width: 220px; }
  #status { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  #fallback { display: none; padding: 0 24px 24px; max-width: 1100px; margin: 0 auto; font-size: 14px; color: var(--muted); }
  #fallback.show { display: block; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; padding: 0 24px 48px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card .preview { background: #fff; padding: 24px; overflow-x: auto; }
  .card .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .card .who { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { border-color: var(--accent); }
  button.done { background: #22c55e; border-color: #22c55e; color: #fff; }
  @media (max-width: 520px) { #grid { grid-template-columns: 1fr; padding: 0 16px 32px; } header, .controls, #fallback { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>

<header>
  <h1>TSI Signature Generator</h1>
  <p>Find your card, hit <strong>Copy signature</strong>, then paste into Gmail: Settings → See all settings → General → Signature. Data is pulled live from the <a id="sheetLink" href="#" target="_blank" rel="noopener">exec directory sheet</a>.</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="search name or role">
  <label>email
    <select id="emailSource">
      <option value="Preferred Email">preferred</option>
      <option value="UWO/Ivey Email">uwo / ivey</option>
    </select>
  </label>
  <label>color
    <select id="theme">
      <option value="ink">ink</option>
      <option value="blue">blue</option>
    </select>
  </label>
  <span id="status">loading…</span>
</div>

<div id="fallback">
  Could not load the sheet (it may be private). Download it as CSV and load it here:
  <input type="file" id="csvInput" accept=".csv">
</div>

<div id="grid"></div>

<script>
const CONFIG = {
  sheetId: '1fN1lbPREbEYDsZ4QgfDHjRHSw0qcJccI2RrO5ggzTXY',
  gid: '0',
  baseUrl: 'https://uwo-tsi.github.io/tsi-signature-generator/',
  org: 'Tethos Student Initiative',
  chapter: 'Western University',
  site: 'tethos.ca',
  siteUrl: 'https://tethos.ca',
};

const THEMES = {
  ink:  { link: '#3a3a44', logo: 'logo.png' },
  blue: { link: '#1d9bf0', logo: 'logo-blue.png' },
};

function theme() { return THEMES[document.getElementById('theme').value] || THEMES.ink; }
function logoFor(t, absolute) { return (absolute ? CONFIG.baseUrl : '') + t.logo; }

const ROLE_LABELS = {
  'PM': 'Project Manager',
};

const COLS = {
  name: 'Name',
  role: 'Role',
  phone: 'Phone',
  linkedin: 'LinkedIn',
};

let people = [];

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift().map(h => h.trim());
  return rows
    .filter(r => r.some(v => v.trim()))
    .map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] || '').trim()])));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatPhone(raw) {
  let d = (raw || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') d = d.slice(1);
  if (d.length !== 10) return { display: (raw || '').trim(), href: '' };
  return { display: `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`, href: `tel:+1${d}` };
}

function normalizeUrl(raw) {
  const v = (raw || '').trim();
  if (!/^https?:\/\//i.test(v)) return '';
  return v.replace(/^http:/i, 'https:').replace(/\/+$/, '');
}

function roleLabel(role) {
  const r = (role || '').trim();
  return ROLE_LABELS[r] || r;
}

function buildSignature(p, t, logoSrc) {
  const font = "'Helvetica Neue',Helvetica,Arial,sans-serif";
  const ink = '#111114', body = '#3a3a44', muted = '#7a7a85', hair = '#e4e4e8', dot = '#b8b8c0';
  const link = (href, text) => `<a href="${href}" style="color:${t.link};text-decoration:none;">${text}</a>`;
  const sep = `<span style="color:${dot};">&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span>`;
  const phone = formatPhone(p.phone);
  const contact = [];
  if (p.email) contact.push(link(`mailto:${esc(p.email)}`, esc(p.email)));
  if (phone.display) contact.push(phone.href ? link(phone.href, esc(phone.display)) : esc(phone.display));
  const links = [link(CONFIG.siteUrl, CONFIG.site)];
  if (p.linkedin) links.push(link(esc(p.linkedin), 'LinkedIn'));

  return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:${font};color:${body};">
<tr>
<td style="vertical-align:top;padding:2px 16px 0 0;">
<a href="${CONFIG.siteUrl}" style="text-decoration:none;"><img src="${logoSrc}" width="40" height="40" alt="Tethos" style="display:block;width:40px;height:40px;border:0;"></a>
</td>
<td style="vertical-align:top;border-left:1px solid ${hair};padding:0 0 0 16px;">
<div style="font-family:${font};font-size:15px;font-weight:600;color:${ink};line-height:20px;letter-spacing:-0.01em;">${esc(p.name)}</div>
<div style="font-family:${font};font-size:13px;color:${body};line-height:19px;">${esc(p.role)}, ${esc(CONFIG.org)}</div>
<div style="font-family:${font};font-size:12px;color:${muted};line-height:18px;">${esc(CONFIG.chapter)}</div>
<div style="font-family:${font};font-size:12px;line-height:18px;padding-top:10px;">${contact.join(sep)}</div>
<div style="font-family:${font};font-size:12px;line-height:18px;">${links.join(sep)}</div>
</td>
</tr>
</table>`;
}

function toPeople(rows) {
  const emailCol = document.getElementById('emailSource').value;
  return rows
    .filter(r => r[COLS.name])
    .map(r => ({
      name: r[COLS.name].replace(/\s+/g, ' ').trim(),
      role: roleLabel(r[COLS.role]),
      phone: r[COLS.phone],
      email: (r[emailCol] || r['Preferred Email'] || '').trim(),
      linkedin: normalizeUrl(r[COLS.linkedin]),
    }));
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const shown = people.filter(p => !q || `${p.name} ${p.role}`.toLowerCase().includes(q));
  for (const p of shown) {
    const card = document.createElement('div');
    card.className = 'card';
    const preview = document.createElement('div');
    preview.className = 'preview';
    const t = theme();
    preview.innerHTML = buildSignature(p, t, logoFor(t, false));
    const bar = document.createElement('div');
    bar.className = 'bar';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = `${p.name} · ${p.role}`;
    const copyBtn = document.createElement('button');
    copyBtn.className = 'primary';
    copyBtn.textContent = 'Copy signature';
    copyBtn.onclick = () => copyRich(p, preview, copyBtn);
    const htmlBtn = document.createElement('button');
    htmlBtn.textContent = 'Copy HTML';
    htmlBtn.onclick = () => copyText(buildSignature(p, theme(), logoFor(theme(), true)), htmlBtn);
    bar.append(who, copyBtn, htmlBtn);
    card.append(preview, bar);
    grid.appendChild(card);
  }
  document.getElementById('status').textContent = `${shown.length} / ${people.length} execs`;
}

function flash(btn, label) {
  const orig = btn.textContent;
  btn.textContent = label;
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 1400);
}

async function copyRich(p, previewEl, btn) {
  const t = theme();
  const html = buildSignature(p, t, logoFor(t, true));
  const plain = previewEl.innerText;
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' }),
    })]);
    flash(btn, 'Copied');
  } catch (e) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.style.position = 'fixed'; tmp.style.left = '-9999px';
    document.body.appendChild(tmp);
    const range = document.createRange();
    range.selectNodeContents(tmp);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges();
    tmp.remove();
    flash(btn, ok ? 'Copied' : 'Failed');
  }
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); flash(btn, 'Copied'); }
  catch (e) { flash(btn, 'Failed'); }
}

let rawRows = [];

function load(rows) {
  rawRows = rows;
  people = toPeople(rawRows);
  render();
}

async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/export?format=csv&gid=${CONFIG.gid}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}

document.getElementById('sheetLink').href = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/edit?gid=${CONFIG.gid}`;
document.getElementById('search').addEventListener('input', render);
document.getElementById('emailSource').addEventListener('change', () => load(rawRows));
document.getElementById('theme').addEventListener('change', render);
document.getElementById('csvInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) load(parseCSV(await f.text()));
});

fetchSheet().then(load).catch(err => {
  document.getElementById('status').textContent = `sheet load failed: ${err.message}`;
  document.getElementById('fallback').classList.add('show');
});
</script>

</body>
</html>
